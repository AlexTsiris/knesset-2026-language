# Окно предвыборной кампании 26-го Кнессета
campaign:
  # Кнессет проголосовал за самороспуск
  start: "2026-07-17"
  # Дата выборов
  election_day: "2026-10-27"
  # Дедлайн подачи партийных списков в ЦИК
  lists_deadline: "2026-09-09"
  # Конец окна сбора: null = "сегодня"
  end: null

collection:
  # Максимум твитов на аккаунт за окно (защита от бесконечного скролла)
  max_tweets_per_account: 3000
  # Пауза между аккаунтами, сек
  delay_between_accounts: 5
  # Включать ли ретвиты в выгрузку (в анализе фильтруются отдельно)
  include_retweets: true
  include_replies: true

analysis:
  # Языки, которые считаем отдельно
  languages: ["he", "en", "ar"]
  # Основной язык анализа фраз
  primary_language: "he"
  # Размеры n-грамм
  ngram_sizes: [1, 2, 3, 4]
  # Минимальная частота, чтобы n-грамма попала в отчёт
  min_ngram_count: 3
  # Бэкенд лемматизации: stanza | dicta | rules
  lemmatizer: "stanza"
  # Сколько топ-фраз выводить
  top_n: 40
