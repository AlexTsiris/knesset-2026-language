# --- Риторические маркеры (считаются отдельно от тем) ---

rhetoric:
  attack:
    ru: "Атака на оппонента"
    he: ["שקר", "שקרן", "כישלון", "מחדל", "פחדן", "בגידה", "בוגד", "התפטר",
         "שחיתות", "שנאה", "הסתה", "ביזיון", "בושה", "אשם", "נכשל", "מסוכן",
         "אסון", "חורבן", "פירוק", "אנרכיסט", "משתמט"]

  program:
    ru: "Программа и обещания"
    he: ["נקדם", "נחיל", "אבטיח", "תוכנית", "יוזמה", "נבנה", "נשקם", "חזון",
         "פתרון", "רפורמה", "נשנה", "נחזיר", "נוביל", "מחויב", "צעד"]

  unity:
    ru: "Единство и мобилизация"
    he: ["אחדות", "יחד", "עם ישראל", "תקווה", "אמונה", "ניצחון", "גבורה",
         "ערבות הדדית", "שליחות"]

  # Односимвольные формы ниже -- не опечатка. stanza отделяет местоименные
  # суффиксы: «אותם» -> «את» + «ם», «שלנו» -> «של» + «נו». Полные формы при
  # разборе не встречаются вовсе, и без отделённых вариантов метрика
  # «мы vs они» теряла бы большую часть попаданий.
  we_words:
    ru: "«Мы»"
    he: ["אנחנו", "אנו", "שלנו", "לנו", "אתנו", "עמנו", "נחנו", "נו"]

  they_words:
    ru: "«Они»"
    he: ["הם", "שלהם", "אותם", "להם", "אצלם", "הן", "שלהן", "ם", "ן"]
