<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Язык предвыборной кампании · Кнессет 2026</title>
<meta name="description" content="Частотный анализ твитов лидеров израильских партий за период предвыборной кампании 2026.">
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --page:#f4f3f0;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --warn:#eda100; --crit:#e34948;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 6px 20px rgba(11,11,11,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --warn:#c98500; --crit:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --warn:#c98500; --crit:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink-1);
  font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
a{color:var(--s1)}
h1{font-size:clamp(26px,4vw,40px);line-height:1.08;margin:0 0 10px;letter-spacing:-.02em}
h2{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:14px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-muted)}
.sec{margin:56px 0 0}
.sec-intro{color:var(--ink-2);font-size:13.5px;margin:2px 0 18px;max-width:76ch}
.he{direction:rtl;unicode-bidi:isolate}
.card{background:var(--surface-1);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}

/* ---- hero ---- */
header{padding:52px 0 8px}
.eyebrow{color:var(--s1);font-weight:600;font-size:13px;letter-spacing:.04em;
  text-transform:uppercase;margin:0 0 14px}
.lede{color:var(--ink-2);font-size:17px;max-width:70ch;margin:0 0 6px}
.disclaimer{color:var(--ink-muted);font-size:13px;max-width:74ch;margin:14px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin:28px 0 0}
.tile{background:var(--surface-1);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.tile .v{font-size:30px;font-weight:680;letter-spacing:-.02em}
.tile .k{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.tile .v small{font-size:15px;font-weight:600;color:var(--ink-2)}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px;align-items:center}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:inherit;font-size:13px;padding:6px 12px;border-radius:7px;white-space:nowrap}
.seg button:hover{color:var(--ink-1)}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
.hint-inline{color:var(--ink-muted);font-size:12.5px}

/* ---- leaderboard ---- */
.lb{display:flex;flex-direction:column;gap:2px}
.lb-row{display:grid;grid-template-columns:34px 168px 1fr 84px;gap:12px;
  align-items:center;padding:7px 8px;border-radius:10px;
  transition:background .15s}
.lb-row:hover{background:color-mix(in srgb,var(--s1) 7%,transparent)}
.rank{color:var(--ink-muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.ava{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
  border:1px solid var(--border);background:var(--grid)}
.who .nm{font-size:13.5px;font-weight:600;line-height:1.15;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.who .pt{font-size:11.5px;color:var(--ink-muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lb-track{background:var(--grid);border-radius:6px;height:16px;overflow:hidden;position:relative}
.lb-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:3px}
.lb-val{text-align:right;font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:600}

/* ---- fingerprint cards ---- */
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:14px}
.fp{position:relative;overflow:hidden}
.fp-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.fp-head .ava{width:46px;height:46px}
.fp-head .nm{font-size:15px;font-weight:660;line-height:1.1}
.fp-head .pt{font-size:11.5px;color:var(--ink-muted)}
.fp-word{font-size:26px;font-weight:700;letter-spacing:-.01em;margin:2px 0 2px}
.fp-word .x{font-size:13px;color:var(--s2);font-weight:600;margin-inline-start:8px}
.fp-sub{font-size:12px;color:var(--ink-muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--border);border-radius:6px;padding:3px 8px;
  background:var(--page);font-size:13px}
.chip b{color:var(--ink-muted);font-weight:500;font-size:11px;margin-inline-start:5px;
  font-variant-numeric:tabular-nums}

/* ---- heatmap ---- */
.scroll{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:640px}
.hm th{color:var(--ink-2);font-weight:600;font-size:11px;padding:0 4px 8px;
  vertical-align:bottom;text-align:center;white-space:nowrap}
.hm th.row{text-align:right;font-weight:600;font-size:12px;padding-right:10px;white-space:nowrap}
.hm td{padding:2px}
.cell{height:30px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums;cursor:default;
  transition:transform .1s}
.cell:hover{transform:scale(1.12);outline:2px solid var(--ink-1);z-index:2;position:relative}
/* Последовательная шкала: «около нуля» уходит к подложке. Классы, а не
   инлайн-цвет, чтобы тёмная тема инвертировала направление автоматически. */
.lv0{background:var(--grid);color:var(--ink-muted)}
.lv1{background:#cde2fb;color:#0b0b0b}.lv2{background:#9ec5f4;color:#0b0b0b}
.lv3{background:#6da7ec;color:#0b0b0b}.lv4{background:#3987e5;color:#fff}
.lv5{background:#256abf;color:#fff}.lv6{background:#184f95;color:#fff}
.lv7{background:#0d366b;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lv1{background:#0d366b;color:#fff}
  :root:not([data-theme=light]) .lv2{background:#184f95;color:#fff}
  :root:not([data-theme=light]) .lv3{background:#256abf;color:#fff}
  :root:not([data-theme=light]) .lv4{background:#3987e5;color:#0b0b0b}
  :root:not([data-theme=light]) .lv5{background:#6da7ec;color:#0b0b0b}
  :root:not([data-theme=light]) .lv6{background:#9ec5f4;color:#0b0b0b}
  :root:not([data-theme=light]) .lv7{background:#cde2fb;color:#0b0b0b}}
:root[data-theme=dark] .lv1{background:#0d366b;color:#fff}
:root[data-theme=dark] .lv2{background:#184f95;color:#fff}
:root[data-theme=dark] .lv3{background:#256abf;color:#fff}
:root[data-theme=dark] .lv4{background:#3987e5;color:#0b0b0b}
:root[data-theme=dark] .lv5{background:#6da7ec;color:#0b0b0b}
:root[data-theme=dark] .lv6{background:#9ec5f4;color:#0b0b0b}
:root[data-theme=dark] .lv7{background:#cde2fb;color:#0b0b0b}

/* ---- diverging attack/program ---- */
.dv-row{display:grid;grid-template-columns:158px 1fr;gap:12px;align-items:center;
  padding:5px 6px;border-radius:10px}
.dv-row:hover{background:color-mix(in srgb,var(--s1) 6%,transparent)}
.dv-who{display:flex;align-items:center;gap:9px;min-width:0}
.dv-who .ava{width:30px;height:30px}
.dv-who .nm{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-bars{display:flex;align-items:center}
.dv-half{height:15px;display:flex;align-items:center;overflow:hidden}
.dv-left{justify-content:flex-end}
.dv-mid{width:1px;background:var(--axis);height:22px;flex:none}
.dv-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dv-lab{font-size:11px;color:var(--ink-2);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- viral ---- */
.vir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.vir-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vir-head .ava{width:40px;height:40px}
.vir-head .nm{font-size:14px;font-weight:640}
.vir-head .likes{margin-inline-start:auto;font-size:14px;font-weight:680;color:var(--s2)}
.vir-text{font-size:14px;line-height:1.5}
.vir-meta{color:var(--ink-muted);font-size:11.5px;margin-top:9px}

/* ---- spark ---- */
.spark-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.spark-card .top{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.spark-card .ava{width:26px;height:26px}
.spark-card .nm{font-size:13px;font-weight:600}

/* ---- corpus chips ---- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink-1);
  color:var(--page);font-size:12.5px;line-height:1.4;padding:7px 10px;border-radius:8px;
  max-width:260px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;
  font-variant-numeric:tabular-nums}
#tip.on{opacity:1}
#tip .he{display:inline-block}

/* ---- methodology ---- */
details{margin-top:12px}
summary{cursor:pointer;color:var(--ink-2);font-size:13px;font-weight:600;
  padding:10px 14px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--ink-muted)}
details[open] summary::before{content:"▾ "}
.meth-table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:10px}
.meth-table th,.meth-table td{text-align:left;padding:8px 10px;
  border-bottom:1px solid var(--grid);vertical-align:top}
.meth-table th{color:var(--ink-2);font-size:11px}
.meth-table code{font-size:11px;color:var(--ink-muted)}

/* ---- theme toggle + footer ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 0;position:sticky;top:0;z-index:10;background:linear-gradient(var(--page) 70%,transparent)}
.brand{font-size:13px;font-weight:600;color:var(--ink-2)}
.tbtn{border:1px solid var(--border);background:var(--surface-1);color:var(--ink-2);
  cursor:pointer;font:inherit;font-size:12.5px;padding:6px 12px;border-radius:9px}
.tbtn:hover{color:var(--ink-1)}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--grid);
  color:var(--ink-muted);font-size:12.5px}
footer a{color:var(--ink-2)}
.loading{padding:80px 0;text-align:center;color:var(--ink-muted)}
@media (max-width:560px){
  .lb-row{grid-template-columns:26px 1fr 70px;}
  .lb-row .lb-track-wrap{display:none}
  .dv-row{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">
  <div class="topbar">
    <span class="brand">Кнессет 2026 · языковая сводка</span>
    <button class="tbtn" id="themeBtn" aria-label="Переключить тему">◐ тема</button>
  </div>
  <div id="app"><div class="loading">Загрузка данных…</div></div>
</div>

<script>
const PALETTE = ['#2a78d6','#eb6834','#1baf7a'];  // проверенная триада (validate_palette)
const $ = (s,el=document)=>el.querySelector(s);
const el = (tag,attrs={},kids=[])=>{
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k==='text')e.textContent=v; else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(k=>k!=null&&e.append(k.nodeType?k:document.createTextNode(k)));
  return e;
};
const pct = x=>Math.round(x*100)+'%';
const sp = n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const photo = id=>`assets/photos/${id}.jpg`;

// ---- tooltip ----
const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');
  const r=tip.getBoundingClientRect();let px=x+14,py=y+14;
  if(px+r.width>innerWidth)px=x-r.width-14; if(py+r.height>innerHeight)py=y-r.height-14;
  tip.style.left=px+'px';tip.style.top=py+'px';}
function hideTip(){tip.classList.remove('on');}
function hov(node,html){node.addEventListener('mousemove',e=>showTip(html,e.clientX,e.clientY));
  node.addEventListener('mouseleave',hideTip);}

// ---- theme ----
(function(){const KEY='knesset-theme';let t;try{t=localStorage.getItem(KEY)}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const mq=matchMedia('(prefers-color-scheme:dark)').matches;
    const next=cur? (cur==='dark'?'light':'dark') : (mq?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next)}catch(e){}
  });})();

fetch('data.json').then(r=>r.json()).then(render).catch(e=>{
  $('#app').innerHTML='<div class="loading">Не удалось загрузить data.json.<br>'+
    'Открой страницу через веб-сервер (GitHub Pages) или <code>python -m http.server</code>.</div>';
  console.error(e);
});

let D, byId;
function render(data){
  D=data; byId=Object.fromEntries(D.politicians.map(p=>[p.id,p]));
  const app=$('#app'); app.innerHTML='';
  app.append(hero(), leaderboard(), fingerprints(), topicsHeat(),
             attackProgram(), weThey(), mentions(), viral(), corpus(),
             methodology(), footer());
}

// ============ HERO ============
function hero(){
  const m=D.meta;
  const dLeft=Math.max(0,Math.round((new Date(m.election_day)-new Date(m.campaign_end))/864e5));
  const wrap=el('header');
  wrap.append(
    el('p',{class:'eyebrow',text:'Выборы в Кнессет · 27 октября 2026'}),
    el('h1',{text:'О чём и как говорят лидеры партий'}),
    el('p',{class:'lede',html:'Частотная сводка твитов лидеров израильских партий за период '+
      'предвыборной кампании. Не политическая оценка — <b>что</b> и <b>как часто</b> они пишут, '+
      'какие слова выдают позицию, кого упоминают.'}),
    el('p',{class:'disclaimer',html:'Ретвиты исключены из текстовых метрик (чужие слова). '+
      'Иврит лемматизирован (stanza): одно слово в разных формах — одно слово. '+
      'Каждая цифра доказуема — см. методологию внизу. Источник — публичные твиты.'}),
  );
  const tiles=el('div',{class:'tiles'});
  const T=[[sp(m.n_tweets),'твитов в корпусе'],[m.n_politicians,'лидеров партий'],
    [m.days,'дней кампании'],[dLeft,'дней до выборов']];
  T.forEach(([v,k])=>tiles.append(el('div',{class:'tile'},[
    el('div',{class:'v',html:v}),el('div',{class:'k',text:k})])));
  wrap.append(tiles);
  return wrap;
}

// ============ LEADERBOARD ============
const LB_METRICS={
  per_day:{label:'Активность',unit:'/дн',fmt:v=>v.toFixed(1)+'/дн',color:0,
    desc:'Твитов в день за окно кампании (все твиты / число дней).'},
  attack:{label:'Атака',unit:'%',fmt:pct,color:1,pctv:1,
    desc:'Доля собственных твитов с лексикой обвинения (ложь, провал, позор…).'},
  program:{label:'Программа',unit:'%',fmt:pct,color:2,pctv:1,
    desc:'Доля собственных твитов с лексикой обещаний (продвинем, построим, план…).'},
  retweet_share:{label:'Ретвиты',unit:'%',fmt:pct,color:1,pctv:1,
    desc:'Доля ретвитов среди всех твитов — усиление чужого голоса.'},
  ttr:{label:'Разнообразие',unit:'',fmt:v=>v.toFixed(2),color:2,
    desc:'Лексическое разнообразие: уникальных слов / всего (иврит). Честно при близком объёме.'},
  wt:{label:'«Мы» / «они»',unit:'',fmt:v=>v.toFixed(1),color:0,
    desc:'Отношение местоимений 1-го лица мн.ч. к 3-му. Выше — язык сплочения.'},
};
function lbValue(p,key){return key==='wt'? p.we/Math.max(1,p.they) : p[key];}
function leaderboard(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Кто во главе — по любой метрике'}),
    el('p',{class:'sec-intro',text:'Выбери метрику — список пересортируется. '+
      'Один ряд = одна величина, поэтому цвет здесь только акцент, не код.'}));
  const seg=el('div',{class:'seg'});
  const controls=el('div',{class:'controls'},[seg]);
  const hint=el('span',{class:'hint-inline'});
  controls.append(hint);
  const body=el('div',{class:'lb'});
  let cur='per_day';
  function draw(){
    const M=LB_METRICS[cur]; hint.textContent=M.desc;
    const rows=[...D.politicians].map(p=>({p,v:lbValue(p,cur)})).sort((a,b)=>b.v-a.v);
    const max=Math.max(...rows.map(r=>r.v))||1;
    body.innerHTML='';
    rows.forEach((r,i)=>{
      const w=Math.max(3,r.v/max*100);
      const track=el('div',{class:'lb-track-wrap'},[
        el('div',{class:'lb-track'},[el('div',{class:'lb-fill',
          style:`width:${w}%;background:${PALETTE[M.color]}`})])]);
      const row=el('div',{class:'lb-row'},[
        el('div',{class:'rank',text:i+1}),
        el('div',{class:'who'},[
          el('img',{class:'ava',src:photo(r.p.id),alt:r.p.name,loading:'lazy'}),
          el('div',{},[el('div',{class:'nm',text:r.p.name}),
            el('div',{class:'pt',text:r.p.party})])]),
        track,
        el('div',{class:'lb-val',text:M.fmt(r.v)}),
      ]);
      hov(row,`<b>${r.p.name}</b><br>${M.label}: ${M.fmt(r.v)}<br>`+
        `<span class="muted">${r.p.tweets} твитов · ${r.p.own} собственных</span>`);
      body.append(row);
    });
  }
  Object.entries(LB_METRICS).forEach(([k,m])=>{
    const b=el('button',{text:m.label,onclick:()=>{cur=k;
      [...seg.children].forEach(c=>c.setAttribute('aria-pressed',c===b));draw();}});
    b.setAttribute('aria-pressed',k===cur); seg.append(b);
  });
  draw();
  sec.append(controls,el('div',{class:'card'},[body]));
  return sec;
}

// ============ FINGERPRINTS ============
function fingerprints(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Слово-отпечаток'}),
    el('p',{class:'sec-intro',html:'Не самое частое слово, а самое <b>отличительное</b>: '+
      'log-likelihood (G²) сравнивает частоту у политика с частотой у всех остальных. '+
      '«Израиль» частотен у всех и потому не появится. Число — во сколько раз чаще прочих.'}));
  const grid=el('div',{class:'fp-grid'});
  const ranked=[...D.politicians].filter(p=>p.keyness.length)
    .sort((a,b)=>(b.keyness[0]?.g2||0)-(a.keyness[0]?.g2||0));
  ranked.forEach(p=>{
    const top=p.keyness[0];
    const chips=el('div',{class:'chips'});
    p.keyness.slice(1,6).forEach(k=>chips.append(
      el('span',{class:'chip'},[el('span',{class:'he',text:k.w}),
        el('b',{text:k.ratio?'×'+k.ratio.toFixed(0):'·'})])));
    const card=el('div',{class:'card fp'},[
      el('div',{class:'fp-head'},[
        el('img',{class:'ava',src:photo(p.id),alt:p.name,loading:'lazy'}),
        el('div',{},[el('div',{class:'nm',text:p.name}),
          el('div',{class:'pt',text:p.party})])]),
      el('div',{class:'fp-word he'},[top.w,
        el('span',{class:'x',text:top.ratio?'×'+top.ratio.toFixed(0):'только он'})]),
      el('div',{class:'fp-sub',text:`${top.count} раз · G²=${top.g2}`}),
      chips,
    ]);
    hov(card,`<b>${p.name}</b><br>Характерное слово: <span class="he">${top.w}</span><br>`+
      `Встречается ${top.count} раз, в ${top.ratio?top.ratio.toFixed(1):'∞'}× чаще прочих`);
    grid.append(card);
  });
  sec.append(grid);
  return sec;
}

// ============ TOPICS HEATMAP ============
function seqLevel(v){ // 0..1 -> класс lv0..lv7 (тема-независимо, инверсия в CSS)
  if(v<=0)return 'lv0';
  return 'lv'+Math.min(7,1+Math.floor(v*7));
}
function topicsHeat(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Темы'}),
    el('p',{class:'sec-intro',text:'Доля собственных твитов, задевших тему. Чем насыщеннее '+
      'клетка, тем выше доля. Наведи на клетку — точное значение. Сумма по строке может '+
      'быть больше 100%: твит касается нескольких тем.'}));
  const order=D.topic_order;
  const tbl=el('table',{class:'hm'});
  const thead=el('tr',{},[el('th',{class:'row'})]);
  order.forEach(t=>thead.append(el('th',{text:D.topic_short[t]})));
  tbl.append(el('thead',{},[thead]));
  const tb=el('tbody');
  const rows=[...D.politicians].sort((a,b)=>b.per_day-a.per_day);
  rows.forEach(p=>{
    const tr=el('tr',{},[el('th',{class:'row',text:p.name})]);
    order.forEach(t=>{
      const s=p.topics[t]||0, v=Math.min(1,s/0.45);
      const cell=el('div',{class:'cell '+seqLevel(v),text:s<0.03?'':pct(s)});
      hov(cell,`<b>${p.name}</b><br>${D.topic_ru[t]}: <b>${pct(s)}</b> твитов`);
      tr.append(el('td',{},[cell]));
    });
    tb.append(tr);
  });
  tbl.append(tb);
  sec.append(el('div',{class:'card scroll'},[tbl]));
  return sec;
}

// ============ ATTACK / PROGRAM ============
function attackProgram(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Атака или программа'}),
    el('p',{class:'sec-intro',html:'Слева — доля твитов с лексикой обвинения '+
      '(<span style="color:var(--s2)">оранжевый</span>), справа — с лексикой обещаний '+
      '(<span style="color:var(--s1)">синий</span>). Общая середина — ноль.'}));
  const maxV=Math.max(...D.politicians.flatMap(p=>[p.attack,p.program]),0.3);
  const body=el('div');
  [...D.politicians].sort((a,b)=>(b.attack+b.program)-(a.attack+a.program)).forEach(p=>{
    const lw=p.attack/maxV*100, rw=p.program/maxV*100;
    const row=el('div',{class:'dv-row'},[
      el('div',{class:'dv-who'},[
        el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{class:'nm',text:p.name})]),
      el('div',{class:'dv-bars'},[
        el('div',{class:'dv-half dv-left',style:'flex:1'},[
          el('span',{class:'dv-lab',text:pct(p.attack)}),
          el('div',{class:'dv-seg',style:`width:${lw}%;background:var(--s2);border-radius:5px 0 0 5px`})]),
        el('div',{class:'dv-mid'}),
        el('div',{class:'dv-half',style:'flex:1'},[
          el('div',{class:'dv-seg',style:`width:${rw}%;background:var(--s1);border-radius:0 5px 5px 0`}),
          el('span',{class:'dv-lab',text:pct(p.program)})]),
      ]),
    ]);
    hov(row,`<b>${p.name}</b><br>Атака: ${pct(p.attack)} · Программа: ${pct(p.program)}`);
    body.append(row);
  });
  sec.append(el('div',{class:'card'},[body]));
  return sec;
}

// ============ WE / THEY ============
function weThey(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'«Мы» против «они»'}),
    el('p',{class:'sec-intro',text:'Отношение местоимений 1-го лица мн.ч. к 3-му. '+
      'Выше — язык сплочения, ниже — язык противостояния.'}));
  const rows=[...D.politicians].map(p=>({p,r:p.we/Math.max(1,p.they)})).sort((a,b)=>b.r-a.r);
  const max=Math.max(...rows.map(x=>x.r))||1;
  const body=el('div',{class:'lb'});
  rows.forEach(({p,r})=>{
    const w=Math.max(3,r/max*100);
    const row=el('div',{class:'lb-row'},[
      el('div',{class:'rank'}),
      el('div',{class:'who'},[el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{},[el('div',{class:'nm',text:p.name}),
          el('div',{class:'pt',text:`мы ${p.we} · они ${p.they}`})])]),
      el('div',{class:'lb-track-wrap'},[el('div',{class:'lb-track'},[
        el('div',{class:'lb-fill',style:`width:${w}%;background:${r>=1?'var(--s3)':'var(--s2)'}`})])]),
      el('div',{class:'lb-val',text:r.toFixed(1)}),
    ]);
    hov(row,`<b>${p.name}</b><br>«мы» ${p.we} / «они» ${p.they} = ${r.toFixed(2)}`);
    body.append(row);
  });
  sec.append(el('div',{class:'card'},[body]));
  return sec;
}

// ============ MENTIONS ============
function mentions(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Кто про кого'}),
    el('p',{class:'sec-intro',text:'Упоминания по @-хэндлу и по имени в тексте. '+
      'Строка — кто говорит, столбец — о ком. Наведи на клетку.'}));
  const ids=D.politicians.map(p=>p.id);
  const emap={}; D.mentions.edges.forEach(e=>emap[e.source+'>'+e.target]=e.weight);
  const maxW=Math.max(...D.mentions.edges.map(e=>e.weight),1);
  const tbl=el('table',{class:'hm'});
  const head=el('tr',{},[el('th',{class:'row',html:'<span class="muted">говорит&nbsp;↓ / о&nbsp;ком&nbsp;→</span>'})]);
  ids.forEach(t=>head.append(el('th',{text:byId[t].name.split(' ').pop()})));
  tbl.append(el('thead',{},[head]));
  const tb=el('tbody');
  ids.forEach(s=>{
    const tr=el('tr',{},[el('th',{class:'row',text:byId[s].name})]);
    ids.forEach(t=>{
      if(s===t){tr.append(el('td',{},[el('div',{class:'cell lv0',text:'·'})]));return;}
      const w=emap[s+'>'+t]||0, v=w/maxW;
      const cell=el('div',{class:'cell '+seqLevel(v),text:w||''});
      hov(cell,`<b>${byId[s].name}</b> → <b>${byId[t].name}</b><br>${w} упоминаний`);
      tr.append(el('td',{},[cell]));
    });
    tb.append(tr);
  });
  tbl.append(tb);
  // most talked about
  const talked=D.mentions.most_talked.slice(0,6);
  const maxT=Math.max(...talked.map(x=>x[1]),1);
  const list=el('div',{class:'lb'});
  talked.forEach(([id,w])=>{
    list.append(el('div',{class:'lb-row',style:'grid-template-columns:34px 168px 1fr 60px'},[
      el('div',{class:'rank'}),
      el('div',{class:'who'},[el('img',{class:'ava',src:photo(id),alt:'',loading:'lazy'}),
        el('div',{class:'nm',text:byId[id].name})]),
      el('div',{class:'lb-track-wrap'},[el('div',{class:'lb-track'},[
        el('div',{class:'lb-fill',style:`width:${w/maxT*100}%;background:var(--s2)`})])]),
      el('div',{class:'lb-val',text:w})]));
  });
  sec.append(el('div',{class:'card scroll'},[tbl]),
    el('div',{class:'card',style:'margin-top:14px'},[
      el('h3',{text:'О ком говорят больше всего'}),list]));
  return sec;
}

// ============ VIRAL ============
function viral(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Самые заметные твиты'}),
    el('p',{class:'sec-intro',text:'Собственный твит каждого политика с максимумом лайков. '+
      'Одна точка — не характеризует средний тон.'}));
  const grid=el('div',{class:'vir-grid'});
  [...D.politicians].filter(p=>p.viral&&p.viral.text)
    .sort((a,b)=>(b.viral.likes||0)-(a.viral.likes||0)).forEach(p=>{
    const v=p.viral, isHe=v.lang==='he';
    const card=el('div',{class:'card'},[
      el('div',{class:'vir-head'},[
        el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{class:'nm',text:p.name}),
        el('div',{class:'likes',text:'❤ '+sp(v.likes)})]),
      el('div',{class:(isHe?'vir-text he':'vir-text'),text:v.text.slice(0,300)}),
      el('div',{class:'vir-meta',text:`${(v.date||'').slice(0,10)} · ${sp(v.retweets||0)} ретвитов`+
        (v.views?` · ${sp(v.views)} просмотров`:'')}),
    ]);
    grid.append(card);
  });
  sec.append(grid);
  return sec;
}

// ============ CORPUS ============
function corpus(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'Общий словарь кампании'}),
    el('p',{class:'sec-intro',text:'Самые частые слова и фразы по всем политикам вместе — '+
      'язык кампании как таковой.'}));
  const grid=el('div',{class:'grid2'});
  [['1','Слова'],['2','Пары'],['3','Тройки']].forEach(([n,title])=>{
    const chips=el('div',{class:'chips'});
    (D.corpus_ngrams[n]||[]).slice(0,14).forEach(x=>chips.append(
      el('span',{class:'chip'},[el('span',{class:'he',text:x.w}),el('b',{text:x.c})])));
    grid.append(el('div',{class:'card'},[el('h3',{text:title}),chips]));
  });
  sec.append(grid);
  return sec;
}

// ============ METHODOLOGY ============
function methodology(){
  const sec=el('section',{class:'sec'});
  const m=D.methodology;
  sec.append(el('h2',{text:'Методология — как посчитана каждая цифра'}),
    el('p',{class:'sec-intro',text:'Каждый показатель доказуем: метрика → какие твиты '+
      'берутся → поле исходного твита → формула.'}));
  if(!m||!m.metrics){sec.append(el('p',{class:'muted',text:'—'}));return sec;}
  const det=el('details');
  det.append(el('summary',{text:'Все метрики: источник, формула, ограничения'}));
  const tbl=el('table',{class:'meth-table'});
  tbl.append(el('thead',{},[el('tr',{},[
    el('th',{text:'Метрика'}),el('th',{text:'Данные'}),
    el('th',{text:'Формула'}),el('th',{text:'Ограничения'})])]));
  const tb=el('tbody');
  Object.entries(m.metrics).forEach(([k,s])=>{
    tb.append(el('tr',{},[
      el('td',{},[el('b',{text:s.ru}),el('br'),el('code',{text:k})]),
      el('td',{html:s.source+'<br><span class="muted">поп.: '+s.population+'</span>'}),
      el('td',{text:s.formula}),
      el('td',{text:s.limits}),
    ]));
  });
  tbl.append(tb); det.append(el('div',{class:'scroll'},[tbl]));
  sec.append(det);
  return sec;
}

// ============ FOOTER ============
function footer(){
  const m=D.meta;
  return el('footer',{html:
    `Собрано ${m.generated_at.slice(0,10)}. Корпус: ${sp(m.n_tweets)} твитов, `+
    `${m.n_politicians} лидеров партий. Лемматизация: ${m.lemmatizer}. `+
    `Ретвиты исключены из текстовых метрик. Цифры описывают частоту слов, а не правоту говорящего. `+
    `Данные — публичные твиты; сбор скрейпингом. `+
    `<a href="https://github.com/AlexTsiris/knesset-2026-language">Код и методология на GitHub</a>.`});
}
