<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>שפת הקמפיין · בחירות 2026</title>
<meta name="description" content="ניתוח תדירות של ציוצי מנהיגי המפלגות בישראל בתקופת מערכת הבחירות 2026.">
<style>
:root{
  color-scheme:light;
  --surface-1:#fcfcfb; --page:#f4f3f0;
  --ink-1:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a;
  --warn:#eda100; --crit:#e34948;
  --shadow:0 1px 2px rgba(11,11,11,.05),0 6px 20px rgba(11,11,11,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  color-scheme:dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --warn:#c98500; --crit:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}}
:root[data-theme=dark]{
  color-scheme:dark;
  --surface-1:#1a1a19; --page:#0d0d0d;
  --ink-1:#fff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70;
  --warn:#c98500; --crit:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink-1);
  font:15px/1.6 "Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 90px}
a{color:var(--s1)}
h1{font-size:clamp(26px,4vw,40px);line-height:1.12;margin:0 0 10px;letter-spacing:-.01em}
h2{font-size:22px;margin:0 0 4px}
h3{font-size:14px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.muted{color:var(--ink-muted)}
.sec{margin:56px 0 0}
.sec-intro{color:var(--ink-2);font-size:14px;margin:2px 0 18px;max-width:76ch}
.en{direction:ltr;unicode-bidi:isolate;display:inline-block}
.card{background:var(--surface-1);border:1px solid var(--border);
  border-radius:14px;padding:18px 20px;box-shadow:var(--shadow)}

/* ---- hero ---- */
header{padding:52px 0 8px}
.eyebrow{color:var(--s1);font-weight:700;font-size:13px;letter-spacing:.02em;
  margin:0 0 14px}
.lede{color:var(--ink-2);font-size:17.5px;max-width:72ch;margin:0 0 6px}
.disclaimer{color:var(--ink-muted);font-size:13.5px;max-width:76ch;margin:14px 0 0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:12px;margin:28px 0 0}
.tile{background:var(--surface-1);border:1px solid var(--border);
  border-radius:12px;padding:16px 18px;box-shadow:var(--shadow)}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em}
.tile .k{font-size:13px;color:var(--ink-2);margin-top:3px}

/* ---- controls ---- */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px;align-items:center}
.seg{display:inline-flex;background:var(--surface-1);border:1px solid var(--border);
  border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap;box-shadow:var(--shadow)}
.seg button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font:inherit;font-size:13.5px;padding:6px 13px;border-radius:7px;white-space:nowrap}
.seg button:hover{color:var(--ink-1)}
.seg button[aria-pressed=true]{background:var(--s1);color:#fff}
.hint-inline{color:var(--ink-muted);font-size:13px}

/* ---- leaderboard ---- */
.lb{display:flex;flex-direction:column;gap:2px}
.lb-row{display:grid;grid-template-columns:32px 176px 1fr 76px;gap:12px;
  align-items:center;padding:7px 8px;border-radius:10px;transition:background .15s}
.lb-row:hover{background:color-mix(in srgb,var(--s1) 7%,transparent)}
.rank{color:var(--ink-muted);font-size:13px;text-align:center;font-variant-numeric:tabular-nums}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.ava{width:38px;height:38px;border-radius:50%;object-fit:cover;flex:none;
  border:1px solid var(--border);background:var(--grid)}
.who .nm{font-size:14px;font-weight:600;line-height:1.15;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.who .pt{font-size:12px;color:var(--ink-muted);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.lb-track{background:var(--grid);border-radius:6px;height:16px;overflow:hidden;position:relative}
.lb-fill{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.4,0,.2,1);min-width:3px}
.lb-val{text-align:left;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700}

/* ---- fingerprint cards ---- */
.fp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:14px}
.fp-head{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.fp-head .ava{width:46px;height:46px}
.fp-head .nm{font-size:16px;font-weight:700;line-height:1.1}
.fp-head .pt{font-size:12px;color:var(--ink-muted)}
.fp-word{font-size:30px;font-weight:800;letter-spacing:-.01em;margin:2px 0}
.fp-word .x{font-size:14px;color:var(--s2);font-weight:700;margin-inline-start:8px}
.fp-sub{font-size:12.5px;color:var(--ink-muted);margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{border:1px solid var(--border);border-radius:6px;padding:3px 9px;
  background:var(--page);font-size:14px}
.chip b{color:var(--ink-muted);font-weight:600;font-size:11px;margin-inline-start:6px;
  font-variant-numeric:tabular-nums}

/* ---- heatmap ---- */
.scroll{overflow-x:auto}
.hm{border-collapse:separate;border-spacing:0;width:100%;font-size:12px;min-width:660px}
.hm th{color:var(--ink-2);font-weight:600;font-size:11.5px;padding:0 4px 8px;
  vertical-align:bottom;text-align:center;white-space:nowrap}
.hm th.row{text-align:start;font-weight:700;font-size:12.5px;padding-inline-end:10px;white-space:nowrap}
.hm td{padding:2px}
.cell{height:30px;border-radius:6px;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums;cursor:default;transition:transform .1s}
.cell:hover{transform:scale(1.12);outline:2px solid var(--ink-1);z-index:2;position:relative}
.lv0{background:var(--grid);color:var(--ink-muted)}
.lv1{background:#cde2fb;color:#0b0b0b}.lv2{background:#9ec5f4;color:#0b0b0b}
.lv3{background:#6da7ec;color:#0b0b0b}.lv4{background:#3987e5;color:#fff}
.lv5{background:#256abf;color:#fff}.lv6{background:#184f95;color:#fff}
.lv7{background:#0d366b;color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .lv1{background:#0d366b;color:#fff}
  :root:not([data-theme=light]) .lv2{background:#184f95;color:#fff}
  :root:not([data-theme=light]) .lv3{background:#256abf;color:#fff}
  :root:not([data-theme=light]) .lv4{background:#3987e5;color:#0b0b0b}
  :root:not([data-theme=light]) .lv5{background:#6da7ec;color:#0b0b0b}
  :root:not([data-theme=light]) .lv6{background:#9ec5f4;color:#0b0b0b}
  :root:not([data-theme=light]) .lv7{background:#cde2fb;color:#0b0b0b}}
:root[data-theme=dark] .lv1{background:#0d366b;color:#fff}
:root[data-theme=dark] .lv2{background:#184f95;color:#fff}
:root[data-theme=dark] .lv3{background:#256abf;color:#fff}
:root[data-theme=dark] .lv4{background:#3987e5;color:#0b0b0b}
:root[data-theme=dark] .lv5{background:#6da7ec;color:#0b0b0b}
:root[data-theme=dark] .lv6{background:#9ec5f4;color:#0b0b0b}
:root[data-theme=dark] .lv7{background:#cde2fb;color:#0b0b0b}

/* ---- diverging ---- */
.dv-row{display:grid;grid-template-columns:170px 1fr;gap:12px;align-items:center;
  padding:5px 6px;border-radius:10px}
.dv-row:hover{background:color-mix(in srgb,var(--s1) 6%,transparent)}
.dv-who{display:flex;align-items:center;gap:9px;min-width:0}
.dv-who .ava{width:30px;height:30px}
.dv-who .nm{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dv-bars{display:flex;align-items:center}
.dv-half{height:15px;display:flex;align-items:center;overflow:hidden}
.dv-left{justify-content:flex-end}
.dv-mid{width:1px;background:var(--axis);height:22px;flex:none}
.dv-seg{height:100%;transition:width .5s cubic-bezier(.4,0,.2,1)}
.dv-lab{font-size:11.5px;color:var(--ink-2);padding:0 6px;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---- viral ---- */
.vir-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(325px,1fr));gap:14px}
.vir-head{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vir-head .ava{width:40px;height:40px}
.vir-head .nm{font-size:14.5px;font-weight:700}
.vir-head .likes{margin-inline-start:auto;font-size:14px;font-weight:700;color:var(--s2)}
.vir-text{font-size:14.5px;line-height:1.55}
.vir-text.ltr{direction:ltr;unicode-bidi:isolate;text-align:left}
.vir-meta{color:var(--ink-muted);font-size:12px;margin-top:9px}

/* ---- corpus ---- */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}

/* ---- tooltip ---- */
#tip{position:fixed;z-index:99;pointer-events:none;background:var(--ink-1);
  color:var(--page);font-size:13px;line-height:1.45;padding:7px 11px;border-radius:8px;
  max-width:270px;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .1s;
  font-variant-numeric:tabular-nums}
#tip.on{opacity:1}

/* ---- methodology ---- */
details{margin-top:12px}
summary{cursor:pointer;color:var(--ink-2);font-size:13.5px;font-weight:600;
  padding:10px 14px;background:var(--surface-1);border:1px solid var(--border);
  border-radius:10px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--ink-muted)}
details[open] summary::before{content:"▾ "}
.meth-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
.meth-table th,.meth-table td{text-align:start;padding:8px 10px;
  border-bottom:1px solid var(--grid);vertical-align:top}
.meth-table th{color:var(--ink-2);font-size:11.5px}
.meth-table code{font-size:11px;color:var(--ink-muted);direction:ltr;unicode-bidi:isolate}

/* ---- topbar/footer ---- */
.topbar{display:flex;align-items:center;justify-content:space-between;
  padding:16px 0 0;position:sticky;top:0;z-index:10;
  background:linear-gradient(var(--page) 70%,transparent)}
.brand{font-size:13px;font-weight:600;color:var(--ink-2)}
.tbtn{border:1px solid var(--border);background:var(--surface-1);color:var(--ink-2);
  cursor:pointer;font:inherit;font-size:13px;padding:6px 13px;border-radius:9px}
.tbtn:hover{color:var(--ink-1)}
footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--grid);
  color:var(--ink-muted);font-size:13px}
footer a{color:var(--ink-2)}
.loading{padding:80px 0;text-align:center;color:var(--ink-muted)}
@media (max-width:560px){
  .lb-row{grid-template-columns:26px 1fr 64px}
  .lb-row .lb-track-wrap{display:none}
  .dv-row{grid-template-columns:120px 1fr}
}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">
  <div class="topbar">
    <span class="brand">כנסת 2026 · מפת שפה</span>
    <button class="tbtn" id="themeBtn" aria-label="החלף ערכת נושא">◐ ערכת נושא</button>
  </div>
  <div id="app"><div class="loading">טוען נתונים…</div></div>
</div>

<script>
const PALETTE=['#2a78d6','#eb6834','#1baf7a'];
const $=(s,el=document)=>el.querySelector(s);
const el=(tag,attrs={},kids=[])=>{
  const e=document.createElement(tag);
  for(const[k,v]of Object.entries(attrs)){
    if(k==='class')e.className=v; else if(k==='html')e.innerHTML=v;
    else if(k==='text')e.textContent=v; else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v);
  }
  (Array.isArray(kids)?kids:[kids]).forEach(k=>k!=null&&e.append(k.nodeType?k:document.createTextNode(k)));
  return e;
};
// LRI…PDI изолирует число как LTR-рун: иначе в RTL пробел-разделитель тысяч
// рвёт «64 102» на группы, и они меняются местами («102 64»). Символы
// невидимы и работают и в тексте, и в подсказках.
const lri=s=>'⁦'+s+'⁩';
const pct=x=>lri(Math.round(x*100)+'%');
const sp=n=>lri(String(n).replace(/\B(?=(\d{3})+(?!\d))/g,' '));
const photo=id=>`assets/photos/${id}.jpg`;
const isHe=s=>/[֐-׿]/.test(s||'');

const tip=$('#tip');
function showTip(html,x,y){tip.innerHTML=html;tip.classList.add('on');
  const r=tip.getBoundingClientRect();let px=x-r.width-14,py=y+14;
  if(px<4)px=x+14; if(py+r.height>innerHeight)py=y-r.height-14;
  tip.style.left=px+'px';tip.style.top=py+'px';}
function hideTip(){tip.classList.remove('on');}
function hov(node,html){node.addEventListener('mousemove',e=>showTip(html,e.clientX,e.clientY));
  node.addEventListener('mouseleave',hideTip);}

(function(){const KEY='knesset-theme';let t;try{t=localStorage.getItem(KEY)}catch(e){}
  if(t)document.documentElement.setAttribute('data-theme',t);
  $('#themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const mq=matchMedia('(prefers-color-scheme:dark)').matches;
    const next=cur?(cur==='dark'?'light':'dark'):(mq?'light':'dark');
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem(KEY,next)}catch(e){}
  });})();

fetch('data.json').then(r=>r.json()).then(render).catch(e=>{
  $('#app').innerHTML='<div class="loading">שגיאה בטעינת data.json. פִּתחו את הדף דרך שרת (GitHub Pages).</div>';
  console.error(e);});

let D,byId;
function render(data){
  D=data; byId=Object.fromEntries(D.politicians.map(p=>[p.id,p]));
  const app=$('#app'); app.innerHTML='';
  app.append(hero(),leaderboard(),fingerprints(),topicsHeat(),
    attackProgram(),weThey(),mentions(),viral(),corpus(),methodology(),footer());
}

// ===== HERO =====
function hero(){
  const m=D.meta;
  const dLeft=Math.max(0,Math.round((new Date(m.election_day)-new Date(m.campaign_end))/864e5));
  const wrap=el('header');
  wrap.append(
    el('p',{class:'eyebrow',text:'בחירות לכנסת · 27 באוקטובר 2026'}),
    el('h1',{text:'על מה — ואיך — מדברים ראשי המפלגות'}),
    el('p',{class:'lede',html:'סקירת תדירות של ציוצי מנהיגי המפלגות בישראל בתקופת מערכת הבחירות. '+
      'לא הערכה פוליטית — <b>מה</b> ו<b>כמה</b> הם כותבים, אילו מילים מסגירות עמדה, את מי הם מאזכרים.'}),
    el('p',{class:'disclaimer',html:'ריטוויטים הוצאו ממדדי הטקסט (מילים של אחר). '+
      'העברית עברה לממטיזציה (stanza): מילה בצורות שונות נספרת כמילה אחת. '+
      'כל מספר ניתן להוכחה — ראו מתודולוגיה בתחתית. המקור — ציוצים פומביים.'}),
  );
  const tiles=el('div',{class:'tiles'});
  [[sp(m.n_tweets),'ציוצים במאגר'],[m.n_politicians,'ראשי מפלגות'],
   [m.days,'ימי קמפיין'],[dLeft,'ימים עד הבחירות']].forEach(([v,k])=>
    tiles.append(el('div',{class:'tile'},[el('div',{class:'v',html:v}),el('div',{class:'k',text:k})])));
  wrap.append(tiles);
  return wrap;
}

// ===== LEADERBOARD =====
const LB={
  per_day:{label:'פעילות',fmt:v=>v.toFixed(1),color:0,
    desc:'ציוצים ליום בחלון הקמפיין (כלל הציוצים חלקי מספר הימים).'},
  attack:{label:'התקפה',fmt:pct,color:1,
    desc:'אחוז הציוצים העצמיים עם שפת האשמה (שקר, כישלון, בושה…).'},
  program:{label:'תוכנית',fmt:pct,color:2,
    desc:'אחוז הציוצים העצמיים עם שפת הבטחה (נקדם, נבנה, תוכנית…).'},
  retweet_share:{label:'ריטוויטים',fmt:pct,color:1,
    desc:'אחוז הריטוויטים מכלל הציוצים — הגברת קול של אחר.'},
  ttr:{label:'גיוון לשוני',fmt:v=>v.toFixed(2),color:2,
    desc:'מילים ייחודיות חלקי סך המילים (עברית). הוגן להשוואה בנפחים דומים.'},
  wt:{label:'«אנחנו» / «הם»',fmt:v=>v.toFixed(1),color:0,
    desc:'יחס כינויי גוף ראשון־רבים לשלישי־רבים. גבוה = שפת ליכוד.'},
};
const lbVal=(p,k)=>k==='wt'?p.we/Math.max(1,p.they):p[k];
function leaderboard(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'מי מוביל — לפי כל מדד'}),
    el('p',{class:'sec-intro',text:'בחרו מדד — הרשימה תמויין מחדש. שורה = ערך אחד, לכן הצבע כאן הדגשה בלבד.'}));
  const seg=el('div',{class:'seg'});
  const hint=el('span',{class:'hint-inline'});
  const controls=el('div',{class:'controls'},[seg,hint]);
  const body=el('div',{class:'lb'});
  let cur='per_day';
  function draw(){
    const M=LB[cur]; hint.textContent=M.desc;
    const rows=[...D.politicians].map(p=>({p,v:lbVal(p,cur)})).sort((a,b)=>b.v-a.v);
    const max=Math.max(...rows.map(r=>r.v))||1;
    body.innerHTML='';
    rows.forEach((r,i)=>{
      const w=Math.max(3,r.v/max*100);
      const row=el('div',{class:'lb-row'},[
        el('div',{class:'rank',text:i+1}),
        el('div',{class:'who'},[
          el('img',{class:'ava',src:photo(r.p.id),alt:r.p.name_he,loading:'lazy'}),
          el('div',{},[el('div',{class:'nm',text:r.p.name_he}),
            el('div',{class:'pt',text:r.p.party_he})])]),
        el('div',{class:'lb-track-wrap'},[el('div',{class:'lb-track'},[
          el('div',{class:'lb-fill',style:`width:${w}%;background:${PALETTE[M.color]}`})])]),
        el('div',{class:'lb-val',text:M.fmt(r.v)}),
      ]);
      hov(row,`<b>${r.p.name_he}</b><br>${M.label}: ${M.fmt(r.v)}<br>`+
        `<span class="muted">${r.p.tweets} ציוצים · ${r.p.own} עצמיים</span>`);
      body.append(row);
    });
  }
  Object.entries(LB).forEach(([k,m])=>{
    const b=el('button',{text:m.label,onclick:()=>{cur=k;
      [...seg.children].forEach(c=>c.setAttribute('aria-pressed',c===b));draw();}});
    b.setAttribute('aria-pressed',k===cur); seg.append(b);
  });
  draw();
  sec.append(controls,el('div',{class:'card'},[body]));
  return sec;
}

// ===== FINGERPRINTS =====
function fingerprints(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'מילת טביעת האצבע'}),
    el('p',{class:'sec-intro',html:'לא המילה הנפוצה, אלא <b>המייחדת</b>: מדד log-likelihood (G²) '+
      'משווה את תדירות המילה אצל הפוליטיקאי מול כל השאר. «ישראל» נפוצה אצל כולם ולכן לא תופיע. '+
      'המספר — פי כמה יותר מהאחרים.'}));
  const grid=el('div',{class:'fp-grid'});
  [...D.politicians].filter(p=>p.keyness.length)
    .sort((a,b)=>(b.keyness[0]?.g2||0)-(a.keyness[0]?.g2||0)).forEach(p=>{
    const top=p.keyness[0];
    const chips=el('div',{class:'chips'});
    p.keyness.slice(1,6).forEach(k=>chips.append(
      el('span',{class:'chip'},[k.w,el('b',{text:k.ratio?'×'+k.ratio.toFixed(0):'·'})])));
    const card=el('div',{class:'card'},[
      el('div',{class:'fp-head'},[
        el('img',{class:'ava',src:photo(p.id),alt:p.name_he,loading:'lazy'}),
        el('div',{},[el('div',{class:'nm',text:p.name_he}),
          el('div',{class:'pt',text:p.party_he})])]),
      el('div',{class:'fp-word'},[top.w,
        el('span',{class:'x',text:top.ratio?'×'+top.ratio.toFixed(0):'רק הוא'})]),
      el('div',{class:'fp-sub',text:`${top.count} פעמים · G²=${top.g2}`}),
      chips,
    ]);
    hov(card,`<b>${p.name_he}</b><br>מילה מייחדת: ${top.w}<br>`+
      `מופיעה ${top.count} פעמים, פי ${top.ratio?top.ratio.toFixed(1):'∞'} מהאחרים`);
    grid.append(card);
  });
  sec.append(grid);
  return sec;
}

// ===== TOPICS =====
function seqLevel(v){if(v<=0)return 'lv0';return 'lv'+Math.min(7,1+Math.floor(v*7));}
function topicsHeat(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'נושאים'}),
    el('p',{class:'sec-intro',text:'אחוז הציוצים העצמיים שנגעו בנושא. ככל שהתא כהה יותר — האחוז גבוה יותר. '+
      'עברו עם העכבר לערך מדויק. סכום שורה יכול לעלות על 100%: ציוץ נוגע בכמה נושאים.'}));
  const order=D.topic_order;
  const tbl=el('table',{class:'hm'});
  const thead=el('tr',{},[el('th',{class:'row'})]);
  order.forEach(t=>thead.append(el('th',{text:D.topic_he_short[t]||D.topic_short[t]})));
  tbl.append(el('thead',{},[thead]));
  const tb=el('tbody');
  [...D.politicians].sort((a,b)=>b.per_day-a.per_day).forEach(p=>{
    const tr=el('tr',{},[el('th',{class:'row',text:p.name_he})]);
    order.forEach(t=>{
      const s=p.topics[t]||0,v=Math.min(1,s/0.45);
      const cell=el('div',{class:'cell '+seqLevel(v),text:s<0.03?'':pct(s)});
      hov(cell,`<b>${p.name_he}</b><br>${D.topic_he[t]||D.topic_ru[t]}: <b>${pct(s)}</b> מהציוצים`);
      tr.append(el('td',{},[cell]));
    });
    tb.append(tr);
  });
  tbl.append(tb);
  sec.append(el('div',{class:'card scroll'},[tbl]));
  return sec;
}

// ===== ATTACK / PROGRAM =====
function attackProgram(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'התקפה או תוכנית'}),
    el('p',{class:'sec-intro',html:'אחוז הציוצים עם שפת האשמה '+
      '(<span style="color:var(--s2)">כתום</span>) מול שפת הבטחה '+
      '(<span style="color:var(--s1)">כחול</span>). האמצע — אפס.'}));
  const maxV=Math.max(...D.politicians.flatMap(p=>[p.attack,p.program]),0.3);
  const body=el('div');
  [...D.politicians].sort((a,b)=>(b.attack+b.program)-(a.attack+a.program)).forEach(p=>{
    const lw=p.attack/maxV*100,rw=p.program/maxV*100;
    const row=el('div',{class:'dv-row'},[
      el('div',{class:'dv-who'},[
        el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{class:'nm',text:p.name_he})]),
      el('div',{class:'dv-bars'},[
        el('div',{class:'dv-half dv-left',style:'flex:1'},[
          el('span',{class:'dv-lab',text:pct(p.attack)}),
          el('div',{class:'dv-seg',style:`width:${lw}%;background:var(--s2);border-radius:5px 0 0 5px`})]),
        el('div',{class:'dv-mid'}),
        el('div',{class:'dv-half',style:'flex:1'},[
          el('div',{class:'dv-seg',style:`width:${rw}%;background:var(--s1);border-radius:0 5px 5px 0`}),
          el('span',{class:'dv-lab',text:pct(p.program)})]),
      ]),
    ]);
    hov(row,`<b>${p.name_he}</b><br>התקפה: ${pct(p.attack)} · תוכנית: ${pct(p.program)}`);
    body.append(row);
  });
  sec.append(el('div',{class:'card'},[body]));
  return sec;
}

// ===== WE / THEY =====
function weThey(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'«אנחנו» מול «הם»'}),
    el('p',{class:'sec-intro',text:'יחס כינויי גוף ראשון־רבים לשלישי־רבים. גבוה — שפת ליכוד; נמוך — שפת עימות.'}));
  const rows=[...D.politicians].map(p=>({p,r:p.we/Math.max(1,p.they)})).sort((a,b)=>b.r-a.r);
  const max=Math.max(...rows.map(x=>x.r))||1;
  const body=el('div',{class:'lb'});
  rows.forEach(({p,r})=>{
    const w=Math.max(3,r/max*100);
    const row=el('div',{class:'lb-row'},[
      el('div',{class:'rank'}),
      el('div',{class:'who'},[el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{},[el('div',{class:'nm',text:p.name_he}),
          el('div',{class:'pt',text:`אנחנו ${p.we} · הם ${p.they}`})])]),
      el('div',{class:'lb-track-wrap'},[el('div',{class:'lb-track'},[
        el('div',{class:'lb-fill',style:`width:${w}%;background:${r>=1?'var(--s3)':'var(--s2)'}`})])]),
      el('div',{class:'lb-val',text:r.toFixed(1)}),
    ]);
    hov(row,`<b>${p.name_he}</b><br>«אנחנו» ${p.we} / «הם» ${p.they} = ${r.toFixed(2)}`);
    body.append(row);
  });
  sec.append(el('div',{class:'card'},[body]));
  return sec;
}

// ===== MENTIONS =====
function mentions(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'מי על מי'}),
    el('p',{class:'sec-intro',text:'אזכורים לפי תגית ולפי שם בטקסט. שורה — מי מדבר, עמודה — על מי. עברו עם העכבר.'}));
  const ids=D.politicians.map(p=>p.id);
  const emap={}; D.mentions.edges.forEach(e=>emap[e.source+'>'+e.target]=e.weight);
  const maxW=Math.max(...D.mentions.edges.map(e=>e.weight),1);
  const tbl=el('table',{class:'hm'});
  const head=el('tr',{},[el('th',{class:'row',html:'<span class="muted">מדבר&nbsp;↓ / על&nbsp;מי&nbsp;→</span>'})]);
  ids.forEach(t=>head.append(el('th',{text:byId[t].name_he.split(' ').pop()})));
  tbl.append(el('thead',{},[head]));
  const tb=el('tbody');
  ids.forEach(s=>{
    const tr=el('tr',{},[el('th',{class:'row',text:byId[s].name_he})]);
    ids.forEach(t=>{
      if(s===t){tr.append(el('td',{},[el('div',{class:'cell lv0',text:'·'})]));return;}
      const w=emap[s+'>'+t]||0,v=w/maxW;
      const cell=el('div',{class:'cell '+seqLevel(v),text:w||''});
      hov(cell,`<b>${byId[s].name_he}</b> ← <b>${byId[t].name_he}</b><br>${w} אזכורים`);
      tr.append(el('td',{},[cell]));
    });
    tb.append(tr);
  });
  tbl.append(tb);
  const talked=D.mentions.most_talked.slice(0,6);
  const maxT=Math.max(...talked.map(x=>x[1]),1);
  const list=el('div',{class:'lb'});
  talked.forEach(([id,w])=>list.append(el('div',{class:'lb-row',style:'grid-template-columns:32px 176px 1fr 60px'},[
    el('div',{class:'rank'}),
    el('div',{class:'who'},[el('img',{class:'ava',src:photo(id),alt:'',loading:'lazy'}),
      el('div',{class:'nm',text:byId[id].name_he})]),
    el('div',{class:'lb-track-wrap'},[el('div',{class:'lb-track'},[
      el('div',{class:'lb-fill',style:`width:${w/maxT*100}%;background:var(--s2)`})])]),
    el('div',{class:'lb-val',text:w})])));
  sec.append(el('div',{class:'card scroll'},[tbl]),
    el('div',{class:'card',style:'margin-top:14px'},[el('h3',{text:'על מי מדברים הכי הרבה'}),list]));
  return sec;
}

// ===== VIRAL =====
function viral(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'הציוצים הבולטים ביותר'}),
    el('p',{class:'sec-intro',text:'הציוץ העצמי של כל פוליטיקאי עם מירב הלייקים. נקודה אחת — אינה מאפיינת את הטון הכללי.'}));
  const grid=el('div',{class:'vir-grid'});
  [...D.politicians].filter(p=>p.viral&&p.viral.text)
    .sort((a,b)=>(b.viral.likes||0)-(a.viral.likes||0)).forEach(p=>{
    const v=p.viral;
    grid.append(el('div',{class:'card'},[
      el('div',{class:'vir-head'},[
        el('img',{class:'ava',src:photo(p.id),alt:'',loading:'lazy'}),
        el('div',{class:'nm',text:p.name_he}),
        el('div',{class:'likes',text:'❤ '+sp(v.likes)})]),
      el('div',{class:(isHe(v.text)?'vir-text':'vir-text ltr'),text:v.text.slice(0,300)}),
      el('div',{class:'vir-meta',text:`${(v.date||'').slice(0,10)} · ${sp(v.retweets||0)} ריטוויטים`+
        (v.views?` · ${sp(v.views)} צפיות`:'')}),
    ]));
  });
  sec.append(grid);
  return sec;
}

// ===== CORPUS =====
function corpus(){
  const sec=el('section',{class:'sec'});
  sec.append(el('h2',{text:'אוצר המילים של הקמפיין'}),
    el('p',{class:'sec-intro',text:'המילים והצירופים הנפוצים ביותר אצל כלל הפוליטיקאים יחד — שפת הקמפיין עצמה.'}));
  const grid=el('div',{class:'grid2'});
  [['1','מילים'],['2','צמדים'],['3','שלשות']].forEach(([n,title])=>{
    const chips=el('div',{class:'chips'});
    (D.corpus_ngrams[n]||[]).slice(0,14).forEach(x=>chips.append(
      el('span',{class:'chip'},[x.w,el('b',{text:x.c})])));
    grid.append(el('div',{class:'card'},[el('h3',{text:title}),chips]));
  });
  sec.append(grid);
  return sec;
}

// ===== METHODOLOGY =====
function methodology(){
  const sec=el('section',{class:'sec'});
  const m=D.methodology_he;
  sec.append(el('h2',{text:'מתודולוגיה — איך חושב כל מספר'}),
    el('p',{class:'sec-intro',text:'כל מדד ניתן להוכחה: מדד → אילו ציוצים נלקחים → שדה בציוץ המקורי → נוסחה.'}));
  if(!m||!m.metrics){sec.append(el('p',{class:'muted',text:'—'}));return sec;}
  if(m.note)sec.append(el('p',{class:'sec-intro',style:'color:var(--ink-muted)',text:m.note}));
  const det=el('details');
  det.append(el('summary',{text:'כל המדדים: מקור, נוסחה, מגבלות'}));
  const tbl=el('table',{class:'meth-table'});
  tbl.append(el('thead',{},[el('tr',{},[
    el('th',{text:'מדד'}),el('th',{text:'מקור'}),el('th',{text:'נוסחה'}),el('th',{text:'מגבלות'})])]));
  const tb=el('tbody');
  Object.entries(m.metrics).forEach(([name,s])=>{
    tb.append(el('tr',{},[
      el('td',{},[el('b',{text:name})]),
      el('td',{},[el('code',{text:s.src})]),
      el('td',{text:s.f}),
      el('td',{text:s.lim}),
    ]));
  });
  tbl.append(tb); det.append(el('div',{class:'scroll'},[tbl]));
  sec.append(det);
  // популяции
  const det2=el('details');
  det2.append(el('summary',{text:'אוכלוסיות (אילו ציוצים)'}));
  const ul=el('div',{class:'card',style:'margin-top:10px'});
  Object.entries(m.populations).forEach(([k,v])=>ul.append(
    el('div',{style:'margin:4px 0'},[el('code',{text:k,style:'direction:ltr;display:inline-block'}),' — '+v])));
  det2.append(ul); sec.append(det2);
  return sec;
}

// ===== FOOTER =====
function footer(){
  const m=D.meta;
  return el('footer',{html:
    `נאסף ב־${m.generated_at.slice(0,10)}. מאגר: ${sp(m.n_tweets)} ציוצים, ${m.n_politicians} ראשי מפלגות. `+
    `לממטיזציה: ${m.lemmatizer}. ריטוויטים הוצאו ממדדי הטקסט. `+
    `המספרים מתארים תדירות מילים, לא צדקת הדובר. המקור — ציוצים פומביים; האיסוף ב־scraping. `+
    `<a href="https://github.com/AlexTsiris/knesset-2026-language">קוד ומתודולוגיה ב־GitHub</a>.`});
}
